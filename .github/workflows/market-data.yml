name: Build market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 只有管道相关变更才触发，数据快照提交不回环触发
    paths:
      - "services/market-data/**"
      - ".github/workflows/market-data.yml"
  schedule:
    # 中国时间 13:35 → UTC 05:35（下午开盘后 5 分钟）
    - cron: "35 5 * * 1-5"
    # 中国时间 15:05 → UTC 07:05（收盘后 5 分钟）
    - cron: "5 7 * * 1-5"

jobs:
  build-market-data:
    # 同一分支串行，避免并发 push 撞车；不取消进行中的运行（否则会打断写数据）
    concurrency:
      group: market-data-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market data dependencies
        run: pip install -r services/market-data/requirements.txt

      - name: Verify pinned akshare version
        # 依赖门禁：实际安装版本必须与锁文件一致，防止上游接口漂移静默打断管道
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          req = Path("services/market-data/requirements.txt").read_text(encoding="utf-8")
          m = re.search(r"^akshare==([\d.]+)\s*$", req, re.M)
          if not m:
              print("::error::requirements.txt 未锁定 akshare 版本（必须 akshare==x.y.z）")
              sys.exit(1)
          pinned = m.group(1)
          import importlib.metadata as md
          installed = md.version("akshare")
          if installed != pinned:
              print(f"::error::akshare 实际版本 {installed} != 锁定版本 {pinned}；禁止未经验证的升级")
              sys.exit(1)
          print(f"akshare pinned ok: {installed}")
          PY

      - name: Backfill missing archive days (self-heal)
        id: backfill
        # 缺口自愈：归档门控或抓取故障留下的缺口，用日 K 接口自动补齐（≤30 天）
        run: python services/market-data/backfill_gap.py --auto

      - name: Build market data
        id: build
        # 常态 30~60s，历史最长有效一次 457s；10 分钟余量过小，15 分钟为 2 倍上限。
        # 超时即失败，避免像历史 8 次那样挂到 GitHub 默认 360 分钟上限、占住 concurrency 组。
        timeout-minutes: 15
        run: python services/market-data/build_market_data.py build-market-data --archive
        env:
          JCQ_SOURCE_DIR: ${{ github.workspace }}

      - name: Build stage leaderboard
        if: steps.build.outputs.skip != 'true'
        run: python services/market-data/build_leaderboard.py

      - name: Build backtest static data
        id: build_backtest
        if: steps.build.outputs.skip != 'true'
        continue-on-error: true
        run: python services/market-data/build_backtest.py

      - name: Report backtest build failure
        if: steps.build_backtest.outcome == 'failure'
        run: echo "::warning::Backtest build failed; market data commit will continue."

      - name: Commit updated data
        id: commit
        if: steps.build.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update market data snapshots and leaderboard"
          file_pattern: apps/web/public/data/*.json apps/web/public/data/archive/** apps/web/public/data/backtest/index.json apps/web/public/data/backtest/summary/** apps/web/public/data/backtest/detail/** ops/trade-calendar.json

      - name: Append pipeline daily log
        if: steps.build.outputs.skip != 'true'
        # 日报：一行/日，供周报"管道健康"固定章节消费
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          CHINA = timezone(timedelta(hours=8))
          status = json.loads(Path("apps/web/public/data/data-status.json").read_text(encoding="utf-8"))
          log = Path("ops/data/pipeline-daily-log.md")
          log.parent.mkdir(parents=True, exist_ok=True)
          today = datetime.now(CHINA).date().isoformat()
          src = "OK" if not status.get("errors") else "DEGRADED"
          line = f"| {today} | stock {status.get('stockCount')} | etf {status.get('etfCount')} | {src} | {('; '.join(status.get('errors') or []))[:120] or '-'} |\n"
          text = log.read_text(encoding="utf-8") if log.exists() else "| 日期 | 股票数 | ETF数 | 状态 | 错误摘要 |\n|------|--------|-------|------|----------|\n"
          if f"| {today} |" not in text:
              text += line
              log.write_text(text, encoding="utf-8")
              print(f"daily log appended: {line.strip()}")
          else:
              print("daily log already has today")
          PY

      - name: Commit daily log
        if: steps.build.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: pipeline daily log"
          file_pattern: ops/data/pipeline-daily-log.md

      - name: Retry push once on rejection
        if: steps.commit.outcome == 'failure'
        run: |
          set -euo pipefail
          git add apps/web/public/data/*.json apps/web/public/data/archive/** \
                  apps/web/public/data/backtest/index.json apps/web/public/data/backtest/summary/** \
                  apps/web/public/data/backtest/detail/** ops/trade-calendar.json ops/data/pipeline-daily-log.md
          git diff --cached --quiet || git commit -m "chore: update market data snapshots and leaderboard"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify data freshness
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = Path("apps/web/public/data")
          latest = json.loads((data / "leaderboard.json").read_text(encoding="utf-8"))["latestDate"]
          latest_dir = sorted(p.name for p in (data / "archive").iterdir() if p.is_dir())[-1]
          today = datetime.now(timezone(timedelta(hours=8))).date().isoformat()

          calendar = None
          try:
              import akshare as ak

              calendar = {str(x)[:10] for x in ak.tool_trade_date_hist_sina()["trade_date"]}
              is_trading_day = today in calendar
          except Exception as exc:  # 日历不可用时退化为工作日判断，只告警不误判
              is_trading_day = datetime.now(timezone(timedelta(hours=8))).weekday() < 5
              print(f"::warning::trade calendar unavailable ({exc}); falling back to weekday check")

          print(f"latestDate={latest} latestArchiveDir={latest_dir} today={today} tradingDay={is_trading_day}")

          failures = []
          if latest_dir != latest:
              failures.append(f"leaderboard.latestDate={latest} 与 archive 最新交易日={latest_dir} 不一致")
          if is_trading_day and latest != today:
              failures.append(
                  f"latestDate={latest} 未更新到今日 {today}：个股抓取失败或归档被跳过，页面会静默陈旧"
              )
          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY

